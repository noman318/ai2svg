<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI to SVG</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --fg:#1d2330; --muted:#677085; --line:#d9dde5; --accent:#2f6fed; --ok:#1a8a4a; --err:#c62f2f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171d; --card:#1d222b; --fg:#e7eaf0; --muted:#9aa3b5; --line:#323947; --accent:#5b8df5; --ok:#4cc27e; --err:#f06b6b; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width:720px; margin:40px auto; padding:0 16px; }
  h1 { font-size:22px; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:40px 16px; text-align:center; cursor:pointer; color:var(--muted); transition:.15s; }
  #drop.over { border-color:var(--accent); color:var(--accent); background:color-mix(in srgb, var(--accent) 8%, transparent); }
  #drop strong { color:var(--fg); }
  label.t { display:block; font-weight:600; margin-bottom:6px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=text] { flex:1; min-width:200px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); font:inherit; }
  button { padding:9px 16px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button:disabled { opacity:.5; cursor:default; }
  .check { display:flex; align-items:center; gap:8px; margin-top:14px; color:var(--muted); }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:10px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  .name { font-weight:600; word-break:break-all; }
  .status { font-size:13px; color:var(--muted); word-break:break-all; }
  .status.ok { color:var(--ok); } .status.err { color:var(--err); }
  .actions { display:flex; justify-content:space-between; align-items:center; margin-top:16px; gap:8px; flex-wrap:wrap; }
</style>
</head>
<body>
<main>
  <h1>AI → SVG converter</h1>
  <p class="sub">Upload Adobe Illustrator files. Each artboard is saved as its own SVG.</p>

  <div class="card">
    <div id="drop"><strong>Drop .ai files here</strong><br>or click to choose</div>
    <input id="file" type="file" accept=".ai" multiple hidden>
  </div>

  <div class="card">
    <label class="t" for="dir">Save to folder</label>
    <div class="row">
      <input id="dir" type="text" spellcheck="false">
      <button id="browse">Browse…</button>
    </div>
    <label class="check"><input id="keep" type="checkbox" checked> Keep text editable (otherwise text becomes outlines)</label>
  </div>

  <div class="card">
    <ul id="list"><li class="status">No files selected.</li></ul>
    <div class="actions">
      <button id="clear">Clear</button>
      <button id="go" class="primary" disabled>Convert</button>
    </div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
let queue = [];

fetch("/default-dir").then(r => r.json()).then(d => { if (!$("dir").value) $("dir").value = d.dir; });

function render() {
  $("list").innerHTML = "";
  if (!queue.length) $("list").innerHTML = '<li class="status">No files selected.</li>';
  for (const item of queue) {
    const li = document.createElement("li");
    li.innerHTML = '<div class="name"></div><div class="status"></div>';
    li.querySelector(".name").textContent = item.file.name;
    const st = li.querySelector(".status");
    st.textContent = item.msg;
    if (item.state) st.classList.add(item.state);
    $("list").append(li);
  }
  $("go").disabled = !queue.some(i => i.state !== "ok");
}

function add(files) {
  for (const f of files) {
    if (!/\.ai$/i.test(f.name)) continue;
    queue.push({ file: f, msg: "Ready", state: "" });
  }
  render();
}

$("drop").onclick = () => $("file").click();
$("file").onchange = (e) => { add(e.target.files); e.target.value = ""; };
$("drop").ondragover = (e) => { e.preventDefault(); $("drop").classList.add("over"); };
$("drop").ondragleave = () => $("drop").classList.remove("over");
$("drop").ondrop = (e) => { e.preventDefault(); $("drop").classList.remove("over"); add(e.dataTransfer.files); };
$("clear").onclick = () => { queue = []; render(); };

$("browse").onclick = async () => {
  $("browse").disabled = true;
  try {
    const r = await fetch("/pick-folder", { method: "POST" });
    const d = await r.json();
    if (d.error) alert(d.error); else if (d.dir) $("dir").value = d.dir;
  } finally { $("browse").disabled = false; }
};

$("go").onclick = async () => {
  $("go").disabled = true;
  for (const item of queue) {
    if (item.state === "ok") continue;
    item.msg = "Converting…"; item.state = ""; render();
    const q = new URLSearchParams({ name: item.file.name, dir: $("dir").value.trim(), keepText: $("keep").checked ? "1" : "0" });
    try {
      const r = await fetch("/convert?" + q, { method: "POST", body: item.file });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error);
      item.msg = "Saved: " + d.files.join(", "); item.state = "ok";
    } catch (err) {
      item.msg = "Error: " + err.message; item.state = "err";
    }
    render();
  }
};
</script>
</body>
</html>
